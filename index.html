<style>
  :root{
    --bg:#0F1522; --bg-2:#141C2E; --panel:#1B2436; --rule:#33405A;
    --ink:#F1E9D6; --muted:#A9A79A; --bean:#8DC46A; --bean-2:#C7E8A8;
    --ochre:#C9A24C; --clay:#B4543A; --navy:#1F2A44; --straw:#D9B36A; --red:#B7332B;
    --display:"Nanum Brush Script","Nanum Myeongjo","Malgun Gothic",serif;

    --num:"Song Myung","Nanum Myeongjo",serif;
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);min-height:100vh;
       background-image:radial-gradient(ellipse at 50% -10%, #2A3350 0%, var(--bg) 55%)}
  .wrap{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;margin:0;color:var(--bean-2);
     text-shadow:0 0 22px rgba(141,196,106,.35)}
  h1 small{display:block;font-family:var(--serif);font-size:12px;letter-spacing:.32em;color:var(--muted);margin-bottom:4px;text-shadow:none;font-weight:700}
  .best{text-align:right;font-size:11px;color:var(--muted);letter-spacing:.1em}
  .best b{display:block;font-family:var(--num);font-size:18px;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}

  .hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);
       border:1px solid var(--rule);border-top:3px solid var(--ochre);padding:9px 14px;font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums}
  .hud .lbl{font-family:var(--serif);font-size:11px;color:var(--muted);letter-spacing:.16em;font-weight:700;margin-bottom:2px}
  .hud .lives{text-align:right}
  .hud .lives i{display:inline-block;width:11px;height:13px;border-radius:50%;background:var(--bean);margin-left:5px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
  .hud .lives i.off{background:var(--rule);box-shadow:none}
  .hud .lv{text-align:center;color:var(--ochre)}

  .stage{position:relative;width:100%;aspect-ratio:3/4;background:var(--bg-2);border:1px solid var(--rule);
         box-shadow:0 0 0 5px #0B1019, 0 20px 50px rgba(0,0,0,.55);overflow:hidden;touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
        background:rgba(15,21,34,.84);text-align:center;padding:24px}
  .veil[hidden]{display:none}
  .veil h2{font-family:var(--display);font-weight:400;font-size:54px;margin:0;color:var(--bean-2);line-height:1;text-wrap:balance}
  .veil p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;max-width:30ch}
  .veil .pts{font-family:var(--num);font-size:20px;color:var(--ink)}
  .btn{font-family:var(--display);font-size:26px;background:var(--ochre);color:#1B1408;border:0;padding:8px 30px;
       cursor:pointer;box-shadow:0 5px 0 #7A5E22;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7A5E22}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .touch-only{display:none} .kb-only{display:inline}
  @media (pointer:coarse){.touch-only{display:inline}.kb-only{display:none}}
  .kb-only i{display:inline-block;border:1px solid var(--rule);padding:0 5px;margin-right:2px;font-style:normal;font-family:var(--num);font-size:11px;color:var(--ink)}
  .toggles{display:flex;gap:6px}
  .ghost{background:transparent;border:1px solid var(--rule);color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}
  .ghost[aria-pressed="true"]{color:var(--ink);border-color:var(--ochre)}
  .ghost:focus-visible{outline:2px solid var(--ochre)}
  .legend{display:flex;gap:12px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);line-height:1.6}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
  .note{font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--rule);padding-top:8px}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}

<body>

<div class="wrap">
  <header>
    <h1><small>동학농민군 · 1894</small>녹두장군 우금치</h1>
    <div class="best">최고 전과<b id="best">0</b></div>
  </header>

  <div class="hud">
    <div><div class="lbl">전과</div><span id="score">0</span></div>
    <div class="lv"><div class="lbl">전투</div><span id="level">황토현</span></div>
    <div class="lives"><div class="lbl">녹두</div><span id="lives"></span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="c" width="480" height="640" aria-label="녹두장군 게임 화면"></canvas>
    <div class="veil" id="veil" hidden>
      <h2 id="vTitle"></h2>
      <p id="vText"></p>
      <div class="pts" id="vPts" hidden></div>
      <button class="btn" id="vBtn">다시 봉기</button>
    </div>
  </div>

  <div class="bar">
    <div><span class="touch-only">장태를 끌어 움직이고, 짧게 탭하면 녹두 발사</span><span class="kb-only"><i>←</i><i>→</i> 또는 마우스로 이동 · <i>SPACE</i> 발사 · <i>P</i> 멈춤</span></div>
    <div class="toggles"><button class="ghost" id="sfx" aria-pressed="true">효과음</button><button class="ghost" id="bgm" aria-pressed="true">음악</button></div>
  </div>
  <div class="legend">
    <span><i style="background:#3C4A6B"></i>보병 1방</span>
    <span><i style="background:#7A2E2A"></i>장교 2방</span>
    <span><i style="background:#6E6E6E"></i>기관총좌 3방</span>
    <span><i style="background:var(--straw)"></i>넓은 장태</span>
    <span><i style="background:var(--bean)"></i>녹두 세 알</span>
    <span><i style="background:#8FA3C7"></i>안개(느린 녹두)</span>
  </div>
  <div class="note">1894년 우금치에서 농민군은 일본군 기관총 앞에 무너졌다. 이 게임은 그 결말을 뒤집어 보는 상상이다. 배경 가락은 「새야 새야 파랑새야」 느낌의 5음계로 만들었다.</div>
</div>

<script>
const W = 480, H = 640, cv = document.getElementById("c"), ctx = cv.getContext("2d");
const BRICK = { cols:8, w:54, h:26, gap:4, top:70 };
BRICK.left = (W - (BRICK.cols*(BRICK.w+BRICK.gap) - BRICK.gap)) / 2;

/* 전투 배치: 1 보병, 2 장교, 3 기관총좌, . 빈 칸 */
const LEVELS = [
  { name:"황토현", map:["11111111","11111111","11111111","..1111.."], line:"1894년 4월, 첫 승리. 장태를 굴려 총알을 막았다." },
  { name:"황룡촌", map:["1.2..2.1","11111111","1..33..1","11111111","..1..1.."], line:"기관총좌가 나타났다. 세 방을 맞혀야 부서진다." },
  { name:"전주성", map:["22222222","1..33..1","11.11.11","1..33..1","11111111",".1....1."], line:"성문 앞 대열. 장교부터 흔들어라." },
  { name:"우금치", map:["33333333","12211221","11111111","3.1111.3","21111112","11.11.11"], line:"안개 낀 고개. 역사와 다른 결말을 향해." }
];
const LEVEL_SCORE = { 1:10, 2:25, 3:50 };

/* ===== 소리: 효과음 + 배경음 ===== */
let AC = null, sfxOn = true, bgmOn = true;
try { sfxOn = localStorage.getItem("nd-sfx") !== "0"; bgmOn = localStorage.getItem("nd-bgm") !== "0"; } catch(e){}
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } } if (AC.state === "suspended") AC.resume(); return AC; }
function tone(f, d, type = "triangle", vol = .06, at = 0, slide = 0){
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol = .08, at = 0, hp = 800){
  const a = ac(); if (!a) return;
  const n = a.sampleRate * d, buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random()*2 - 1) * (1 - i/n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + at;
  s.buffer = buf; f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const SFX = {
  launch(){ if (sfxOn) tone(520, .12, "sine", .07, 0, 380); },
  wall(){ if (sfxOn) tone(300, .04, "triangle", .03); },
  paddle(){ if (sfxOn) { tone(180, .07, "square", .04); noise(.04, .03, 0, 2000); } },
  hit(){ if (sfxOn) { noise(.06, .07, 0, 600); tone(140, .08, "sawtooth", .03, 0, -60); } },
  metal(){ if (sfxOn) { tone(1800, .05, "square", .04); tone(2400, .09, "sine", .03, .02); } },
  smash(){ if (sfxOn) { noise(.12, .09, 0, 300); tone(90, .18, "sine", .09, 0, -50); } },
  gatling(){ if (sfxOn) { for (let i = 0; i < 4; i++) noise(.03, .06, i*.05, 1500); tone(70, .3, "sine", .1, 0, -30); } },
  item(){ if (sfxOn) { tone(880, .08, "sine", .06); tone(1320, .12, "sine", .05, .07); } },
  lose(){ if (sfxOn) { tone(220, .5, "sawtooth", .06, 0, -150); noise(.3, .05, 0, 200); } },
  clear(){ if (sfxOn) { [0, .12, .24, .36].forEach((t, i) => tone([1760, 2093, 2637, 3136][i], .25, "square", .04, t)); noise(.25, .08, 0, 4000); tone(110, .5, "sine", .1, .4, -40); } }
};

/* 배경음: 5음계(계면조풍 D F G A C) 가락 + 북·장구 */
const BGM = (() => {
  const N = { D4:293.66, F4:349.23, G4:392.00, A4:440.00, C5:523.25, D5:587.33, C4:261.63, A3:220.00 };
  // [음, 길이(박)] — 「새야 새야 파랑새야」 느낌으로 만든 창작 가락
  const MEL = [
    ["A4",1],["A4",1],["G4",1],["A4",1], ["C5",1.5],["A4",.5],["G4",2],
    ["A4",1],["G4",1],["F4",1],["D4",1], ["F4",1.5],["G4",.5],["F4",2],
    ["D4",1],["F4",1],["G4",1],["A4",1], ["G4",1.5],["F4",.5],["D4",2],
    ["F4",1],["D4",1],["C4",1],["D4",1], ["F4",1.5],["D4",.5],["D4",2]
  ];
  const BEAT = 60 / 84; let idx = 0, next = 0, beat = 0, timer = null, playing = false;
  function schedule(){
    const a = ac(); if (!a) return;
    while (next < a.currentTime + .4) {
      const [n, len] = MEL[idx]; const t = next - a.currentTime;
      const f = N[n];
      tone(f, len*BEAT*.95, "triangle", .045, t); tone(f*2, len*BEAT*.6, "sine", .012, t + .01); // 대금 느낌
      for (let b = 0; b < len; b += 1) { const bt = t + b*BEAT;
        if ((beat + b) % 2 === 0) tone(75, .22, "sine", .11, bt, -25); else noise(.05, .035, bt, 3000); // 북 / 장구
      }
      beat += len; next += len*BEAT; idx = (idx + 1) % MEL.length;
    }
  }
  return {
    start(){ if (playing || !bgmOn) return; const a = ac(); if (!a) return; playing = true; idx = 0; beat = 0; next = a.currentTime + .1; timer = setInterval(schedule, 120); schedule(); },
    stop(){ playing = false; clearInterval(timer); timer = null; },
    get playing(){ return playing; }
  };
})();

/* ===== 상태 ===== */
let G;
function fresh(){ return { score:0, lives:3, level:0, bricks:[], balls:[], drops:[], paddle:{x:W/2, w:96, h:14, y:H-48, wideUntil:0}, slowUntil:0, state:"play", shake:0, particles:[], best:0, banner:0 }; }
try { G = fresh(); G.best = +localStorage.getItem("nd-best") || 0; } catch(e){ G = fresh(); }

function buildLevel(n){
  const L = LEVELS[n % LEVELS.length]; G.bricks = [];
  L.map.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === ".") return;
    G.bricks.push({ x: BRICK.left + c*(BRICK.w+BRICK.gap), y: BRICK.top + r*(BRICK.h+BRICK.gap), hp:+ch, max:+ch, seed: Math.random() }); }));
  G.banner = 150;
}
function speedFor(){ const loop = Math.floor(G.level / LEVELS.length); return 4.5 + G.level*0.35 + loop*0.5; }
function newBall(){ return { x:G.paddle.x, y:G.paddle.y - 9, r:7, vx:0, vy:0, stuck:true, trail:[], spin: Math.random()*Math.PI }; }
function serve(){ G.balls = [newBall()]; G.drops = []; }
function launch(b){ if (!b.stuck) return; const s = speedFor(), a = -Math.PI/2 + (Math.random()*.6 - .3); b.vx = Math.cos(a)*s; b.vy = Math.sin(a)*s; b.stuck = false; SFX.launch(); }
function userGesture(){ ac(); if (bgmOn) BGM.start(); }

/* ===== 입력 ===== */
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key] = true; userGesture();
  if (e.key === " ") { if (G.state === "play") G.balls.forEach(launch); else veilAction(); }
  if (e.key === "p" || e.key === "P") togglePause();
});
addEventListener("keyup", e => keys[e.key] = false);
const stage = document.getElementById("stage");
function pointerX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
let press = null;
stage.addEventListener("pointermove", e => { if (G.state === "play" && (e.pointerType === "mouse" || press !== null)) movePaddle(pointerX(e)); });
stage.addEventListener("pointerdown", e => { userGesture(); if (G.state !== "play") return; press = pointerX(e); movePaddle(press); if (e.pointerType === "mouse") G.balls.forEach(launch); });
stage.addEventListener("pointerup", e => { if (G.state === "play" && press !== null && e.pointerType !== "mouse" && Math.abs(pointerX(e) - press) < 12) G.balls.forEach(launch); press = null; });
stage.addEventListener("pointercancel", () => press = null);
function movePaddle(x){ const p = G.paddle; p.x = Math.max(p.w/2, Math.min(W - p.w/2, x)); G.balls.forEach(b => { if (b.stuck) b.x = p.x; }); }

/* ===== 게임 루프 ===== */
let last = 0;
function loop(t){ const dt = Math.min(2, (t - last) / 16.67 || 1); last = t; if (G.state === "play") update(dt); draw(); requestAnimationFrame(loop); }
function update(dt){
  const p = G.paddle, now = performance.now();
  if (keys.ArrowLeft) movePaddle(p.x - 7*dt);
  if (keys.ArrowRight) movePaddle(p.x + 7*dt);
  p.w = now < p.wideUntil ? 150 : 96;
  const slow = now < G.slowUntil ? .62 : 1;
  for (const b of G.balls) {
    if (b.stuck) { b.x = p.x; b.y = p.y - 9; continue; }
    b.trail.push([b.x, b.y]); if (b.trail.length > 7) b.trail.shift();
    b.x += b.vx*dt*slow; b.y += b.vy*dt*slow; b.spin += .2*dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); SFX.wall(); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); SFX.wall(); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); SFX.wall(); }
    if (b.vy > 0 && b.y + b.r >= p.y && b.y - b.r <= p.y + p.h && b.x >= p.x - p.w/2 - b.r && b.x <= p.x + p.w/2 + b.r) {
      const rel = (b.x - p.x) / (p.w/2), a = rel * (Math.PI/3), s = Math.hypot(b.vx, b.vy) * 1.01;
      b.vx = Math.sin(a)*s; b.vy = -Math.cos(a)*s; b.y = p.y - b.r - 1; SFX.paddle();
    }
    for (const k of G.bricks) {
      if (k.hp <= 0) continue;
      if (b.x + b.r < k.x || b.x - b.r > k.x + BRICK.w || b.y + b.r < k.y || b.y - b.r > k.y + BRICK.h) continue;
      const ox = Math.min(b.x + b.r - k.x, k.x + BRICK.w - (b.x - b.r)), oy = Math.min(b.y + b.r - k.y, k.y + BRICK.h - (b.y - b.r));
      if (ox < oy) { b.vx = -b.vx; b.x += b.vx > 0 ? ox : -ox; } else { b.vy = -b.vy; b.y += b.vy > 0 ? oy : -oy; }
      k.hp--;
      if (k.hp <= 0) { G.score += LEVEL_SCORE[k.max]; burst(k.x + BRICK.w/2, k.y + BRICK.h/2, k.max); k.max === 3 ? SFX.gatling() : SFX.smash();
        if (Math.random() < .15) G.drops.push({ x:k.x + BRICK.w/2, y:k.y + 10, t:["wide","multi","slow"][Math.floor(Math.random()*3)] }); }
      else { G.score += 3; k.max === 3 ? SFX.metal() : SFX.hit(); splat(k, b); }
      break;
    }
  }
  G.balls = G.balls.filter(b => b.y - b.r < H);
  if (!G.balls.length) { G.lives--; G.shake = 12; SFX.lose(); if (G.lives <= 0) return gameOver(); serve(); }
  for (const d of G.drops) { d.y += 2.3*dt; if (d.y > p.y - 12 && d.y < p.y + p.h + 12 && Math.abs(d.x - p.x) < p.w/2 + 10) { d.got = true; grab(d.t); } }
  G.drops = G.drops.filter(d => !d.got && d.y < H + 12);
  for (const q of G.particles) { q.x += q.vx*dt; q.y += q.vy*dt; q.vy += .14*dt; q.life -= dt; }
  G.particles = G.particles.filter(q => q.life > 0);
  if (G.shake > 0) G.shake -= dt;
  if (G.banner > 0) G.banner -= dt;
  if (!G.bricks.some(k => k.hp > 0)) levelClear();
  hud();
}
function grab(t){
  const now = performance.now(); SFX.item(); G.score += 20;
  if (t === "wide") G.paddle.wideUntil = now + 8000;
  if (t === "slow") G.slowUntil = now + 8000;
  if (t === "multi") { const src = G.balls.find(b => !b.stuck) || G.balls[0]; const s = Math.hypot(src.vx, src.vy) || speedFor();
    for (const a of [-.5, .5]) { const ang = Math.atan2(src.vy || -1, src.vx || 0) + a; G.balls.push({ x:src.x, y:src.y, r:7, vx:Math.cos(ang)*s, vy:Math.sin(ang)*s, stuck:false, trail:[], spin:0 }); } }
}
function burst(x, y, kind){
  const cols = kind === 3 ? ["#9A9A9A","#5A5A5A","#E0B457"] : kind === 2 ? ["#7A2E2A","#3C4A6B","#F1E9D6"] : ["#3C4A6B","#2A3350","#F1E9D6"];
  for (let i = 0; i < 14; i++) { const a = Math.random()*Math.PI*2, s = 1 + Math.random()*3.2; G.particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 1.2, life: 20 + Math.random()*14, col: cols[i % cols.length], sz: 3 + Math.random()*3 }); }
  for (let i = 0; i < 5; i++) { const a = Math.random()*Math.PI*2; G.particles.push({ x, y, vx:Math.cos(a)*2, vy:Math.sin(a)*2 - 1, life: 16, col:"#8DC46A", sz:3 }); }
}
function splat(k, b){ k.splats = k.splats || []; k.splats.push([b.x - k.x, b.y - k.y]); for (let i = 0; i < 4; i++) { const a = Math.random()*Math.PI*2; G.particles.push({ x:b.x, y:b.y, vx:Math.cos(a)*1.5, vy:Math.sin(a)*1.5 - .5, life:12, col:"#8DC46A", sz:2.5 }); } }

/* ===== 상태 전환 ===== */
const veil = document.getElementById("veil"), vTitle = document.getElementById("vTitle"), vText = document.getElementById("vText"), vPts = document.getElementById("vPts"), vBtn = document.getElementById("vBtn");
function showVeil(title, text, btn, pts){ vTitle.innerHTML = title; vText.textContent = text; vBtn.textContent = btn; vPts.hidden = pts == null; if (pts != null) vPts.textContent = pts; veil.hidden = false; }
function veilAction(){
  userGesture();
  if (G.state === "over") { const best = G.best; G = fresh(); G.best = best; buildLevel(0); serve(); veil.hidden = true; }
  else if (G.state === "clear") { G.level++; buildLevel(G.level); serve(); G.state = "play"; veil.hidden = true; }
  else if (G.state === "pause") togglePause();
  hud();
}
vBtn.addEventListener("click", veilAction);
function togglePause(){
  if (G.state === "play") { G.state = "pause"; showVeil("잠시 숨을 고른다", "P 키나 버튼으로 다시 나선다.", "다시 나서기", `전과 ${G.score}`); }
  else if (G.state === "pause") { G.state = "play"; veil.hidden = true; }
}
function levelClear(){
  const L = LEVELS[G.level % LEVELS.length], nextL = LEVELS[(G.level + 1) % LEVELS.length];
  G.state = "clear"; G.score += 100; saveBest(); SFX.clear();
  showVeil(`${L.name} 승리`, (G.level + 1 >= LEVELS.length ? "고개를 넘었다. 같은 길을 더 빠른 녹두로 다시 간다. " : "") + `다음은 ${nextL.name}. ${nextL.line}`, `${nextL.name}로`, `전과 ${G.score}`);
}
function gameOver(){ G.state = "over"; saveBest(); showVeil("안개 속으로", G.score >= G.best && G.score > 0 ? "최고 전과다. 녹두꽃은 다시 핀다." : `최고 전과는 ${G.best}. 녹두꽃은 다시 핀다.`, "다시 봉기", `전과 ${G.score}`); hud(); }
function saveBest(){ if (G.score > G.best) { G.best = G.score; try { localStorage.setItem("nd-best", G.best); } catch(e){} } }
function hud(){
  document.getElementById("score").textContent = G.score;
  document.getElementById("level").textContent = LEVELS[G.level % LEVELS.length].name + (G.level >= LEVELS.length ? ` ×${Math.floor(G.level / LEVELS.length) + 1}` : "");
  document.getElementById("lives").innerHTML = [0,1,2].map(i => `<i class="${i < G.lives ? "" : "off"}"></i>`).join("");
  document.getElementById("best").textContent = G.best;
}
const sfxBtn = document.getElementById("sfx"), bgmBtn = document.getElementById("bgm");
function syncToggles(){ sfxBtn.setAttribute("aria-pressed", sfxOn); bgmBtn.setAttribute("aria-pressed", bgmOn); }
sfxBtn.addEventListener("click", () => { sfxOn = !sfxOn; try { localStorage.setItem("nd-sfx", sfxOn ? "1" : "0"); } catch(e){} syncToggles(); if (sfxOn) SFX.item(); });
bgmBtn.addEventListener("click", () => { bgmOn = !bgmOn; try { localStorage.setItem("nd-bgm", bgmOn ? "1" : "0"); } catch(e){} syncToggles(); bgmOn ? BGM.start() : BGM.stop(); });
syncToggles();
document.addEventListener("visibilitychange", () => { if (document.hidden) BGM.stop(); else if (bgmOn && AC) BGM.start(); });

/* ===== 그리기 ===== */
const bgCanvas = document.createElement("canvas"); bgCanvas.width = W; bgCanvas.height = H;
(function paintBg(){
  const g = bgCanvas.getContext("2d");
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#0E1424"); sky.addColorStop(.6, "#182238"); sky.addColorStop(1, "#22301F");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(241,233,214,${.25 + Math.random()*.5})`; g.fillRect(Math.random()*W, Math.random()*H*.5, 1.5, 1.5); }
  g.fillStyle = "rgba(239,227,185,.10)"; g.beginPath(); g.arc(406, 38, 40, 0, Math.PI*2); g.fill();
  g.fillStyle = "#EFE3B9"; g.beginPath(); g.arc(406, 38, 25, 0, Math.PI*2); g.fill();
  g.fillStyle = "rgba(180,170,140,.25)"; g.beginPath(); g.arc(399, 32, 5, 0, Math.PI*2); g.fill(); g.beginPath(); g.arc(412, 44, 3.5, 0, Math.PI*2); g.fill();
  const hill = (y, amp, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, H); g.lineTo(0, y); for (let x = 0; x <= W; x += 20) g.lineTo(x, y - Math.sin(x/70)*amp - Math.sin(x/23)*amp*.3); g.lineTo(W, H); g.closePath(); g.fill(); };
  hill(H*.62, 28, "#1B2740"); hill(H*.7, 20, "#16203A"); hill(H*.78, 14, "#2B3A22");
  g.strokeStyle = "rgba(141,196,106,.10)"; g.lineWidth = 1; for (let y = H*.8; y < H; y += 12) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(0, BRICK.top - 12, W, 6*(BRICK.h+BRICK.gap) + 20);
})();

function drawSoldier(k){
  const { x, y } = k, w = BRICK.w, h = BRICK.h, kind = k.max, hurt = k.max - k.hp;
  ctx.save(); ctx.translate(x, y);
  if (kind === 3) { // 기관총좌
    ctx.fillStyle = "#6E6E6E"; ctx.fillRect(0, 6, w, h - 6);
    ctx.fillStyle = "#4A4A4A"; ctx.fillRect(0, h - 5, w, 5);
    ctx.fillStyle = "#2E2E2E"; ctx.fillRect(w*.42, 0, w*.16, h); ctx.fillRect(w*.3, 8, w*.4, 6);
    ctx.fillStyle = "#E0B457"; ctx.fillRect(w*.47, 2, w*.06, 5);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = "#3C4A6B"; ctx.fillRect(4 + i*8, 12, 6, 9); ctx.fillStyle = "#E8C9A6"; ctx.fillRect(5 + i*8, 9, 4, 4); }
  } else {
    const body = kind === 2 ? "#4A2E33" : "#3C4A6B", cap = kind === 2 ? "#7A2E2A" : "#2A3350";
    for (let i = 0; i < 4; i++) { const sx = 6 + i*12, sway = Math.sin(performance.now()/400 + k.seed*6 + i) * .6;
      ctx.fillStyle = body; ctx.fillRect(sx, 11 + sway, 9, h - 11);
      ctx.fillStyle = "#E8C9A6"; ctx.fillRect(sx + 2, 6 + sway, 5, 5);
      ctx.fillStyle = cap; ctx.fillRect(sx + 1, 3 + sway, 7, 4); ctx.fillStyle = "#E0B457"; ctx.fillRect(sx + 4, 4 + sway, 1.5, 1.5);
      ctx.strokeStyle = "#1A1A1A"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(sx + 9, 14 + sway); ctx.lineTo(sx + 12, 2 + sway); ctx.stroke(); }
    if (kind === 2) { ctx.fillStyle = "#B7332B"; ctx.fillRect(0, h - 4, w, 3); ctx.fillStyle = "#E0B457"; ctx.fillRect(w/2 - 3, h - 4, 6, 3); }
  }
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(0, h - 2, w, 2);
  if (k.splats) for (const [sx, sy] of k.splats) { ctx.fillStyle = "rgba(141,196,106,.85)"; ctx.beginPath(); ctx.ellipse(Math.max(4, Math.min(w-4, sx)), Math.max(4, Math.min(h-4, sy)), 5, 3.5, .5, 0, Math.PI*2); ctx.fill(); }
  if (hurt) { ctx.fillStyle = `rgba(0,0,0,${.15*hurt})`; ctx.fillRect(0, 0, w, h); }
  ctx.restore();
}
function drawJangtae(p){
  const w = p.w, h = p.h, x = p.x - w/2, y = p.y, wide = performance.now() < p.wideUntil;
  ctx.fillStyle = wide ? "#E6C77E" : "#D9B36A"; ctx.beginPath(); ctx.roundRect(x, y, w, h, 7); ctx.fill();
  ctx.strokeStyle = "rgba(90,60,20,.55)"; ctx.lineWidth = 1; for (let i = x + 6; i < x + w - 3; i += 7) { ctx.beginPath(); ctx.moveTo(i, y + 2); ctx.lineTo(i, y + h - 2); ctx.stroke(); }
  ctx.strokeStyle = "rgba(60,40,10,.7)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 2, y + h/2); ctx.lineTo(x + w - 2, y + h/2); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.fillRect(x + 4, y + 2, w - 8, 2);
}
function drawBean(b, slow){
  b.trail.forEach((t, i) => { ctx.globalAlpha = (i+1) / b.trail.length * .22; ctx.fillStyle = "#8DC46A"; ctx.beginPath(); ctx.arc(t[0], t[1], b.r * (i+1)/b.trail.length, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.spin);
  ctx.fillStyle = slow ? "#8FA3C7" : "#7BB35B"; ctx.beginPath(); ctx.ellipse(0, 0, b.r + 1, b.r - 1, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.ellipse(-2, -2, 3, 1.8, -.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(-1, -1, 2, 2.5);
  ctx.restore();
}
function draw(){
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random()-.5)*G.shake, (Math.random()-.5)*G.shake);
  ctx.drawImage(bgCanvas, 0, 0);
  const fog = performance.now() < G.slowUntil;
  for (const k of G.bricks) if (k.hp > 0) drawSoldier(k);
  for (const d of G.drops) {
    ctx.fillStyle = d.t === "wide" ? "#D9B36A" : d.t === "multi" ? "#8DC46A" : "#8FA3C7"; ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#1B1408"; ctx.font = "bold 11px " + getComputedStyle(document.body).fontFamily; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(d.t === "wide" ? "넓" : d.t === "multi" ? "셋" : "안", d.x, d.y + 1); }
  for (const q of G.particles) { ctx.globalAlpha = Math.max(0, q.life / 30); ctx.fillStyle = q.col; ctx.fillRect(q.x - q.sz/2, q.y - q.sz/2, q.sz, q.sz); }
  ctx.globalAlpha = 1;
  drawJangtae(G.paddle);
  for (const b of G.balls) drawBean(b, fog);
  if (fog) { ctx.fillStyle = "rgba(143,163,199,.10)"; ctx.fillRect(0, 0, W, H); }
  const stuck = G.balls.some(b => b.stuck);
  if (stuck && G.state === "play") { ctx.fillStyle = "#F1E9D6"; ctx.globalAlpha = .55 + .45*Math.sin(performance.now()/250); ctx.font = "14px " + getComputedStyle(document.body).fontFamily; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(matchMedia("(pointer:coarse)").matches ? "장태를 끌어 움직이고, 탭하면 녹두 발사" : "마우스로 움직이고, 클릭 또는 SPACE로 발사", W/2, G.paddle.y + 38); ctx.globalAlpha = 1; }
  if (G.banner > 0) { const L = LEVELS[G.level % LEVELS.length], a = Math.min(1, G.banner / 40);
    ctx.globalAlpha = a; ctx.fillStyle = "rgba(15,21,34,.7)"; ctx.fillRect(0, 300, W, 64);
    ctx.fillStyle = "#C7E8A8"; ctx.font = "34px " + getComputedStyle(document.querySelector("h1")).fontFamily; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(`${L.name} 전투`, W/2, 322);
    ctx.fillStyle = "#F1E9D6"; ctx.font = "12px " + getComputedStyle(document.body).fontFamily; ctx.fillText(L.line, W/2, 348); ctx.globalAlpha = 1; }
  ctx.fillStyle = "rgba(241,233,214,.55)"; ctx.font = "bold 11px " + getComputedStyle(document.body).fontFamily; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText("보국안민 · 척왜양창의", 12, 22);
  ctx.restore();
}

buildLevel(0); serve(); hud();
requestAnimationFrame(loop);
</script>
